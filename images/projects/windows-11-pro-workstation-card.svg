<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Windows 11 Pro cybersecurity workstation build</title>
  <desc id="desc">Diagram-style thumbnail showing a hardened Windows workstation connected to Hyper-V, WSL2, Docker, Dev Drive, GitHub, and security documentation workflows.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="675" rx="38" fill="url(#bg)"/>
  <g opacity="0.24" stroke="#38bdf8" stroke-width="2">
    <path d="M80 115h1040M80 220h1040M80 325h1040M80 430h1040M80 535h1040"/>
    <path d="M165 70v535M345 70v535M525 70v535M705 70v535M885 70v535M1065 70v535"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="115" y="95" width="455" height="485" rx="28" fill="url(#panel)" stroke="#334155" stroke-width="3"/>
    <rect x="150" y="135" width="385" height="250" rx="20" fill="#020617" stroke="#475569" stroke-width="2"/>
    <rect x="175" y="162" width="100" height="18" rx="9" fill="#38bdf8"/>
    <rect x="175" y="205" width="305" height="12" rx="6" fill="#64748b"/>
    <rect x="175" y="236" width="255" height="12" rx="6" fill="#64748b"/>
    <rect x="175" y="267" width="325" height="12" rx="6" fill="#64748b"/>
    <rect x="175" y="310" width="145" height="34" rx="17" fill="#0f766e"/>
    <rect x="338" y="310" width="145" height="34" rx="17" fill="#1d4ed8"/>
    <rect x="235" y="405" width="215" height="22" rx="11" fill="#334155"/>
    <rect x="285" y="427" width="115" height="75" rx="8" fill="#1e293b"/>
    <rect x="220" y="502" width="250" height="24" rx="12" fill="#334155"/>
