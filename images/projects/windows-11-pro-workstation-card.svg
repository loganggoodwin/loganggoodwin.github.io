  <g filter="url(#shadow)">
    <rect x="650" y="110" width="395" height="100" rx="24" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
    <rect x="650" y="238" width="395" height="100" rx="24" fill="#111827" stroke="#22c55e" stroke-width="2"/>
    <rect x="650" y="366" width="395" height="100" rx="24" fill="#111827" stroke="#a78bfa" stroke-width="2"/>
    <rect x="650" y="494" width="395" height="100" rx="24" fill="#111827" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#e5e7eb">
    <text x="160" y="78" font-size="34" font-weight="700">Windows 11 Pro Workstation</text>
    <text x="674" y="148" font-size="25" font-weight="700">Hyper-V + WSL2</text>
    <text x="674" y="181" font-size="17" fill="#94a3b8">Virtualization-ready security lab base</text>
    <text x="674" y="276" font-size="25" font-weight="700">Docker + Ubuntu</text>
    <text x="674" y="309" font-size="17" fill="#94a3b8">Container, Linux, and dev workflow support</text>
    <text x="674" y="404" font-size="25" font-weight="700">Dev Drive + GitHub</text>
    <text x="674" y="437" font-size="17" fill="#94a3b8">Dedicated project, script, and code layout</text>
    <text x="674" y="532" font-size="25" font-weight="700">BitLocker + Standard User</text>
    <text x="674" y="565" font-size="17" fill="#94a3b8">Hardened baseline with admin separation</text>
  </g>
  <g stroke="#38bdf8" stroke-width="4" fill="none" opacity="0.9">
